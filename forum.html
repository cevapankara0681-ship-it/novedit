<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

<title>NOV Edit Forum | Tartışma ve Destek Topluluğu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/jpeg" href="logo.jpg">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg-dark: #000000;
  --bg-card: #0a0a0a;
  --bg-hover: #121212;
  --text-white: #ffffff;
  --text-gray: #888888;
  --text-light: #cccccc;
  --border: #222222;
  --border-hover: #444444;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background: var(--bg-dark); color: var(--text-white); line-height: 1.6; overflow-x: hidden; }
.container { width: 90%; max-width: 1100px; margin: auto; }

/* NAVİGASYON */
.nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(0,0,0,0.93); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
.nav .container { display: flex; justify-content: space-between; align-items: center; }
.logo { font-size: 22px; font-weight: 800; letter-spacing: 3px; color: var(--text-white); text-transform: uppercase; text-decoration: none; }
.nav-auth-btn { background: var(--text-white); color: var(--bg-dark); padding: 8px 18px; border-radius: 2px; font-weight: 700; cursor: pointer; text-decoration: none; font-size: 13px; transition: 0.3s; }
.nav-auth-btn:hover { opacity: 0.9; }

/* LAYOUT */
.forum-container { display: grid; grid-template-columns: 3fr 1fr; gap: 40px; padding: 140px 0 60px; min-height: 80px; }
.forum-main { display: flex; flex-direction: column; gap: 15px; }

.forum-topic { background: var(--bg-card); border: 1px solid var(--border); padding: 25px; transition: all 0.3s ease; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-radius: 4px; }
.forum-topic:hover { border-color: var(--border-hover); background: var(--bg-hover); transform: translateX(4px); }
.topic-info h3 { font-size: 18px; font-weight: 600; color: var(--text-white); margin-bottom: 6px; }
.topic-info p { font-size: 13px; color: var(--text-gray); }
.topic-badge { background: #1a1a1a; padding: 4px 10px; border-radius: 2px; font-size: 11px; font-weight: 600; color: var(--text-light); text-transform: uppercase; margin-right: 8px; border: 1px solid #333; }
.topic-city { background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 2px; font-size: 11px; font-weight: 600; color: #fff; margin-right: 8px; }
.topic-go { color: var(--text-white); font-weight: 700; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }

/* SIDEBAR */
.forum-sidebar { display: flex; flex-direction: column; gap: 20px; }
.sidebar-box { background: var(--bg-card); border: 1px solid var(--border); padding: 30px; text-align: center; border-radius: 4px; }
.sidebar-box h4 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
.btn-primary { display: block; width: 100%; background: var(--text-white); color: var(--bg-dark); padding: 14px; text-decoration: none; font-weight: 700; font-size: 13px; text-transform: uppercase; border: none; cursor: pointer; transition: 0.3s; letter-spacing: 1px; border-radius: 2px; }
.btn-primary:hover { opacity: 0.85; }
.btn-outline { display: block; width: 100%; background: transparent; color: var(--text-white); border: 1px solid var(--border); padding: 12px; text-decoration: none; font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.3s; margin-top: 10px; border-radius: 2px; }
.btn-outline:hover { background: var(--border); }

/* TARTIŞMA DETAYI */
#topicDetailView { display: none; }
.back-btn { background: transparent; color: var(--text-gray); border: none; font-size: 14px; cursor: pointer; margin-bottom: 25px; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
.back-btn:hover { color: var(--text-white); }
.detail-header { background: var(--bg-card); border: 1px solid var(--border); padding: 35px; border-radius: 4px; margin-bottom: 25px; }
.detail-title { font-size: 26px; font-weight: 800; line-height: 1.4; margin-bottom: 12px; }
.detail-meta { font-size: 13px; color: var(--text-gray); margin-bottom: 15px; }
.detail-content { font-size: 16px; color: #f0f0f0; border-top: 1px solid var(--border); padding-top: 20px; white-space: pre-wrap; line-height: 1.7; }

/* CEVAP AKIŞI */
.reply-card { background: var(--bg-card); border: 1px solid var(--border); border-left: 3px solid var(--text-white); padding: 20px; margin-bottom: 15px; border-radius: 0 4px 4px 0; }
.reply-author { font-weight: 700; font-size: 14px; margin-bottom: 6px; color: var(--text-light); }
.reply-content { font-size: 15px; color: #dddddd; white-space: pre-wrap; }
.reply-box { margin-top: 40px; background: var(--bg-card); padding: 30px; border: 1px solid var(--border); border-radius: 4px; }
.reply-box h3 { font-size: 16px; margin-bottom: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
.reply-box textarea { width: 100%; height: 120px; background: var(--bg-dark); border: 1px solid var(--border); color: #fff; padding: 15px; margin-bottom: 15px; resize: vertical; font-size: 14px; outline: none; }

/* GELİŞMİŞ MODAL (KİLİTLİ) */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 9999; }
.modal-overlay.active { display: flex; }
.modal-content { background: var(--bg-card); border: 1px solid var(--border); width: 92%; max-width: 550px; padding: 35px; position: relative; border-radius: 6px; box-shadow: 0 25px 60px rgba(0,0,0,0.7); animation: modalFade 0.25s ease; }
@keyframes modalFade { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-close { position: absolute; top: 15px; right: 20px; font-size: 28px; color: var(--text-gray); cursor: pointer; }
.modal-close:hover { color: #fff; }
.modal-content h2 { font-size: 20px; font-weight: 800; text-transform: uppercase; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
.modal-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-gray); margin-bottom: 6px; display: block; font-weight: 600; }
.modal-content input, .modal-content select, .modal-content textarea { width: 100%; background: var(--bg-dark); border: 1px solid var(--border); color: #fff; padding: 12px; margin-bottom: 15px; font-size: 14px; outline: none; border-radius: 2px; }
.modal-content textarea { height: 120px; resize: none; }

/* RESPONSIVE */
@media (max-width: 768px) {
  .forum-container { grid-template-columns: 1fr; padding-top: 110px; gap: 30px; }
  .forum-sidebar { order: -1; }
  .forum-topic { flex-direction: column; align-items: flex-start; gap: 15px; }
}
</style>
</head>
<body>

<nav class="nav">
  <div class="container">
    <a href="index.html" class="logo">NOV Edit</a>
    <a class="nav-auth-btn" id="navLoginBtn" onclick="signInWithGoogle()">Giriş Yap</a>
  </div>
</nav>

<section class="container forum-container">
  
  <div class="forum-left">
    <div id="topicListView">
      <div id="topicListContainer">
        <p style="color: var(--text-gray); text-align: center; padding: 40px;">Veritabanı taranıyor...</p>
      </div>
    </div>

    <div id="topicDetailView">
      <button class="back-btn" onclick="closeTopicDetail()">← Tartışma Listesine Dön</button>
      
      <div class="detail-header">
        <h2 class="detail-title" id="detailTitle">Yükleniyor...</h2>
        <p class="detail-meta" id="detailMeta"></p>
        <div class="detail-content" id="detailContent"></div>
      </div>

      <div id="repliesContainer"></div>

      <div class="reply-box">
        <h3>Tartışmaya Katıl</h3>
        <textarea id="replyContent" placeholder="Fikirlerinizi buraya yazın..."></textarea>
        <button class="btn-primary" id="submitReplyBtn" onclick="submitReply()">Mesajı Gönder</button>
        <p id="replyLoginWarning" style="color:#ff4444; font-size:13px; margin-top:12px; display:none; text-align:center;">Cevap yazabilmek için sisteme giriş yapmalısınız.</p>
      </div>
    </div>
  </div>

  <div class="forum-sidebar">
    <div class="sidebar-box" id="userPanelPlaceholder">
      <h4>Topluluk Alanı</h4>
      <p style="font-size: 12px; color: var(--text-gray); margin-bottom: 20px;">Fikir alışverişinde bulunmak ve yeni başlık açmak için Google ile bağlanın.</p>
      <button class="btn-primary" onclick="signInWithGoogle()">Google ile Giriş</button>
    </div>

    <div class="sidebar-box" id="userPanelActive" style="display: none;">
      <h4>Profiliniz</h4>
      <p id="loggedInUserName" style="font-size: 14px; font-weight: 600; margin-bottom: 20px;"></p>
      <button class="btn-primary" onclick="openModal('newTopicModal')">Yeni Konu Başlat</button>
      <button class="btn-outline" onclick="signOut()">Çıkış Yap</button>
    </div>
  </div>

</section>

<div class="modal-overlay" id="newTopicModal">
  <div class="modal-content">
    <span class="modal-close" onclick="closeModal('newTopicModal')">×</span>
    <h2>Yeni Konu Başlat</h2>
    
    <label class="modal-label">Tartışma Başlığı</label>
    <input type="text" id="topicTitle" placeholder="Konunun ana başlığı nedir?">
    
    <label class="modal-label">Şehir Bilgisi</label>
    <input type="text" id="topicCity" placeholder="Örn: Kocaeli, İstanbul veya Genel">

    <label class="modal-label">Kategori</label>
    <select id="topicCategory">
      <option value="Web Tasarım">Web Tasarım</option>
      <option value="Video Düzenleme">Video Düzenleme</option>
      <option value="Dijital Pazarlama">Dijital Pazarlama</option>
      <option value="Genel">Genel</option>
    </select>

    <label class="modal-label">Detaylı Açıklama</label>
    <textarea id="topicContent" placeholder="Tartışmak istediğiniz detayları buraya yazın..."></textarea>

    <button class="btn-primary" style="padding: 15px;" onclick="createNewTopic()">Konuyu Yayına Al</button>
  </div>
</div>

<script>
  const supabaseUrl = 'https://lcwsccfautsefmxskinf.supabase.co';
  const supabaseKey = 'sb_publishable_3hqQFmO9okI3O5ITKgJbsA_0Ga23UUz';
  const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

  let currentUser = null;
  let currentActiveTopicId = null;

  window.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    updateAuthState(session?.user);
    supabaseClient.auth.onAuthStateChange((_event, session) => updateAuthState(session?.user));
    loadTopicsList();
  });

  function updateAuthState(user) {
    currentUser = user;
    if (user) {
      document.getElementById('navLoginBtn').style.display = 'none';
      document.getElementById('userPanelPlaceholder').style.display = 'none';
      document.getElementById('userPanelActive').style.display = 'block';
      document.getElementById('loggedInUserName').innerText = user.user_metadata.full_name || user.email;
      document.getElementById('replyLoginWarning').style.display = 'none';
      document.getElementById('submitReplyBtn').style.display = 'block';
    } else {
      document.getElementById('navLoginBtn').style.display = 'block';
      document.getElementById('userPanelPlaceholder').style.display = 'block';
      document.getElementById('userPanelActive').style.display = 'none';
      document.getElementById('replyLoginWarning').style.display = 'block';
      document.getElementById('submitReplyBtn').style.display = 'none';
    }
  }

  async function signInWithGoogle() { await supabaseClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + '/forum.html' } }); }
  async function signOut() { await supabaseClient.auth.signOut(); location.reload(); }
  function openModal(id) { document.getElementById(id).classList.add('active'); }
  function closeModal(id) { document.getElementById(id).classList.remove('active'); }

  /* LİSTELEME SİSTEMİ */
  async function loadTopicsList() {
    const container = document.getElementById('topicListContainer');
    const { data: topics, error } = await supabaseClient.from('topics').select('*').order('created_at', { ascending: false });
    
    if (error) { container.innerHTML = '<p style="color:red; text-align:center;">Bağlantı hatası.</p>'; return; }
    if (!topics || topics.length === 0) { container.innerHTML = '<p style="color:var(--text-gray); text-align:center; padding:40px;">Henüz konu açılmamış.</p>'; return; }

    container.innerHTML = topics.map(t => {
      const escapedTitle = t.title.replace(/'/g, "\\'");
      const escapedContent = (t.content || '').replace(/'/g, "\\'").replace(/\n/g, "\\n");
      const cityBadge = t.city ? `<span class="topic-city">${t.city}</span>` : '';
      
      return `
        <div class="forum-topic" onclick="openTopicDetail(${t.id}, '${escapedTitle}', '${t.author_name}', '${t.category}', '${escapedContent}')">
          <div class="topic-info">
            <h3>${t.title}</h3>
            <p>${cityBadge}<span class="topic-badge">${t.category}</span> Yazar: <strong>${t.author_name}</strong></p>
          </div>
          <div class="topic-go">Göz At →</div>
        </div>
      `;
    }).join('');
  }

  /* DETAY GÖRÜNÜMÜ */
  async function openTopicDetail(id, title, author, category, content) {
    currentActiveTopicId = id;
    document.getElementById('topicListView').style.display = 'none';
    document.getElementById('topicDetailView').style.display = 'block';
    
    document.getElementById('detailTitle').innerText = title;
    document.getElementById('detailMeta').innerText = `Kategori: ${category} | Başlatan: ${author}`;
    document.getElementById('detailContent').innerText = content || 'Açıklama belirtilmemiş.';
    
    loadReplies(id);
  }

  function closeTopicDetail() {
    currentActiveTopicId = null;
    document.getElementById('topicDetailView').style.display = 'none';
    document.getElementById('topicListView').style.display = 'block';
    loadTopicsList();
  }

  /* YORUM MOTORU */
  async function loadReplies(topicId) {
    const container = document.getElementById('repliesContainer');
    container.innerHTML = '<p style="color:var(--text-gray);">Akış yükleniyor...</p>';
    const { data: replies } = await supabaseClient.from('replies').select('*').eq('topic_id', topicId).order('created_at', { ascending: true });

    if (!replies || replies.length === 0) {
      container.innerHTML = '<p style="color:var(--text-gray); padding:20px 0;">Henüz yorum yok. Tartışmayı başlatın!</p>';
      return;
    }
    container.innerHTML = replies.map(r => `
      <div class="reply-card">
        <div class="reply-author">${r.author_name}</div>
        <div class="reply-content">${r.content}</div>
      </div>
    `).join('');
  }

  async function submitReply() {
    if (!currentUser) return;
    const input = document.getElementById('replyContent');
    const val = input.value.trim();
    if (!val) return alert("Boş mesaj gönderilemez.");

    await supabaseClient.from('replies').insert([{
      topic_id: currentActiveTopicId,
      author_name: currentUser.user_metadata.full_name || currentUser.email,
      content: val
    }]);
    input.value = '';
    loadReplies(currentActiveTopicId);
  }

  /* YENİ KONU EKLEME */
  async function createNewTopic() {
    if (!currentUser) return;
    const title = document.getElementById('topicTitle').value.trim();
    const city = document.getElementById('topicCity').value.trim();
    const category = document.getElementById('topicCategory').value;
    const content = document.getElementById('topicContent').value.trim();
    
    if (!title || !content) return alert("Lütfen başlık ve açıklama alanlarını doldurun.");

    const { error } = await supabaseClient.from('topics').insert([{
      title,
      city,
      category,
      content,
      author_name: currentUser.user_metadata.full_name || currentUser.email
    }]);

    if (error) alert("Hata: " + error.message);
    else {
      document.getElementById('topicTitle').value = '';
      document.getElementById('topicCity').value = '';
      document.getElementById('topicContent').value = '';
      closeModal('newTopicModal');
      loadTopicsList();
    }
  }
</script>
</body>
</html>
