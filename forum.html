<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOV Edit Forum | Topluluk</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
/* GENEL TASARIM */
:root { --bg-dark: #000; --bg-card: #0a0a0a; --bg-hover: #151515; --text: #fff; --gray: #888; --border: #222; --accent: #fff; }
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background: var(--bg-dark); color: var(--text); line-height: 1.6; overflow-x: hidden; }
.container { width: 90%; max-width: 1000px; margin: auto; padding-top: 100px; padding-bottom: 50px; }

/* BUTONLAR */
.btn { background: var(--accent); color: #000; padding: 12px 24px; border: none; cursor: pointer; font-weight: 700; font-size: 14px; text-transform: uppercase; border-radius: 2px; transition: 0.3s; }
.btn:hover { opacity: 0.8; }
.btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
.btn-outline:hover { background: var(--border); }

/* ÜST MENÜ */
.header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
.header-bar h1 { font-size: 32px; font-weight: 800; letter-spacing: -1px; }

/* KONU LİSTESİ */
.topic-card { background: var(--bg-card); border: 1px solid var(--border); padding: 25px; margin-bottom: 15px; cursor: pointer; transition: all 0.3s ease; display: flex; justify-content: space-between; align-items: center; border-radius: 4px; }
.topic-card:hover { border-color: #555; transform: translateY(-2px); background: var(--bg-hover); }
.topic-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
.topic-meta { font-size: 13px; color: var(--gray); }

/* KONU DETAY EKRANI (İÇİ) */
#topicDetailView { display: none; }
.back-btn { background: transparent; color: var(--gray); border: none; font-size: 14px; cursor: pointer; margin-bottom: 20px; display: flex; align-items: center; gap: 5px; }
.back-btn:hover { color: var(--text); }
.detail-header { background: var(--bg-card); border: 1px solid var(--border); padding: 30px; border-radius: 4px; margin-bottom: 30px; }
.detail-title { font-size: 28px; font-weight: 700; margin-bottom: 10px; }

/* YORUMLAR */
.reply-card { background: var(--bg-dark); border-left: 3px solid var(--border); padding: 20px; margin-bottom: 15px; }
.reply-author { font-weight: 600; font-size: 14px; color: var(--accent); margin-bottom: 5px; }
.reply-content { font-size: 15px; color: #ddd; white-space: pre-wrap; }
.reply-box { margin-top: 40px; background: var(--bg-card); padding: 25px; border: 1px solid var(--border); border-radius: 4px; }
.reply-box textarea { width: 100%; height: 120px; background: #000; border: 1px solid var(--border); color: #fff; padding: 15px; margin-bottom: 15px; resize: vertical; font-size: 14px; outline: none; }
.reply-box textarea:focus { border-color: var(--gray); }

/* YENİ KONU MODALI (GELİŞMİŞ) */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 9999; }
.modal-content { background: var(--bg-card); border: 1px solid var(--border); width: 90%; max-width: 500px; padding: 40px; position: relative; border-radius: 6px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
.modal-close { position: absolute; top: 20px; right: 25px; font-size: 24px; color: var(--gray); cursor: pointer; transition: 0.3s; }
.modal-close:hover { color: #fff; }
.modal-content h2 { font-size: 24px; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
.modal-content input, .modal-content select { width: 100%; background: #000; border: 1px solid var(--border); color: #fff; padding: 15px; margin-bottom: 20px; font-size: 15px; outline: none; }
.modal-content input:focus { border-color: var(--gray); }

/* Mobil Uyum */
@media (max-width: 768px) {
  .header-bar { flex-direction: column; align-items: flex-start; gap: 15px; }
  .topic-card { flex-direction: column; align-items: flex-start; gap: 10px; }
}
</style>
</head>
<body>

<div class="container">
  
  <div id="topicListView">
    <div class="header-bar">
      <div>
        <h1>NOV Edit Forum</h1>
        <p style="color:var(--gray); font-size:14px; margin-top:5px;">Tartışmalara katılın, sorular sorun.</p>
      </div>
      <div id="authButtons">
        <button class="btn" onclick="signInWithGoogle()" id="loginBtn">Google ile Giriş Yap</button>
        <div id="userMenu" style="display:none; align-items:center; gap:15px;">
          <span id="userNameDisplay" style="font-size:13px; color:var(--gray);"></span>
          <button class="btn" onclick="openModal('newTopicModal')">Yeni Konu Aç</button>
          <button class="btn btn-outline" style="padding:10px 15px;" onclick="signOut()">Çıkış</button>
        </div>
      </div>
    </div>

    <div id="topicListContainer">
      <p style="color:var(--gray); text-align:center; padding:40px;">Konular yükleniyor...</p>
    </div>
  </div>

  <div id="topicDetailView">
    <button class="back-btn" onclick="closeTopicDetail()">← Konu Listesine Dön</button>
    
    <div class="detail-header">
      <h2 class="detail-title" id="detailTitle">Konu Başlığı</h2>
      <p class="topic-meta" id="detailMeta">Yazar • Tarih • Kategori</p>
    </div>

    <div id="repliesContainer">
      </div>

    <div class="reply-box">
      <h3 style="margin-bottom:15px; font-size:18px;">Cevap Yaz</h3>
      <textarea id="replyContent" placeholder="Bu konu hakkındaki düşüncelerinizi buraya yazın..."></textarea>
      <button class="btn" id="submitReplyBtn" onclick="submitReply()">Gönder</button>
      <p id="replyLoginWarning" style="color:#ff4444; font-size:13px; margin-top:10px; display:none;">Yorum yazmak için giriş yapmalısınız.</p>
    </div>
  </div>

</div>

<div class="modal-overlay" id="newTopicModal">
  <div class="modal-content">
    <span class="modal-close" onclick="closeModal('newTopicModal')">×</span>
    <h2>Yeni Konu Başlat</h2>
    
    <label style="font-size:12px; color:var(--gray); margin-bottom:5px; display:block;">Konu Başlığı</label>
    <input type="text" id="topicTitle" placeholder="Örn: SEO uyumlu web sitesi nasıl yapılır?">
    
    <label style="font-size:12px; color:var(--gray); margin-bottom:5px; display:block;">Kategori</label>
    <select id="topicCategory">
      <option value="Web Tasarım">Web Tasarım</option>
      <option value="Video Düzenleme">Video Düzenleme</option>
      <option value="Dijital Pazarlama">Dijital Pazarlama</option>
      <option value="Genel">Genel</option>
    </select>

    <button class="btn" style="width:100%; padding:15px;" onclick="createNewTopic()">Konuyu Paylaş</button>
  </div>
</div>

<script>
/* --- SUPABASE BAĞLANTISI --- */
const supabaseUrl = 'https://lcwsccfautsefmxskinf.supabase.co';
const supabaseKey = 'sb_publishable_3hqQFmO9okI3O5ITKgJbsA_0Ga23UUz';
const supabase = supabase.createClient(supabaseUrl, supabaseKey);

let currentUser = null;
let currentActiveTopicId = null;

/* --- SİSTEM BAŞLANGICI VE GİRİŞ KONTROLÜ --- */
window.addEventListener('DOMContentLoaded', async () => {
  // 1. Kullanıcıyı kontrol et
  const { data: { session } } = await supabase.auth.getSession();
  updateAuthState(session?.user);

  supabase.auth.onAuthStateChange((_event, session) => {
    updateAuthState(session?.user);
  });

  // 2. Ana listedeki konuları yükle
  loadTopicsList();
});

function updateAuthState(user) {
  currentUser = user;
  if (user) {
    document.getElementById('loginBtn').style.display = 'none';
    document.getElementById('userMenu').style.display = 'flex';
    document.getElementById('userNameDisplay').innerText = user.user_metadata.full_name || user.email;
    document.getElementById('replyLoginWarning').style.display = 'none';
    document.getElementById('submitReplyBtn').disabled = false;
  } else {
    document.getElementById('loginBtn').style.display = 'block';
    document.getElementById('userMenu').style.display = 'none';
    document.getElementById('replyLoginWarning').style.display = 'block';
    document.getElementById('submitReplyBtn').disabled = true;
  }
}

/* --- GİRİŞ / ÇIKIŞ İŞLEMLERİ --- */
async function signInWithGoogle() { await supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href }}); }
async function signOut() { await supabase.auth.signOut(); location.reload(); }

/* --- 1. EKRAN: KONULARI LİSTELEME --- */
async function loadTopicsList() {
  const { data: topics, error } = await supabase.from('topics').select('*').order('created_at', { ascending: false });
  const container = document.getElementById('topicListContainer');
  
  if (error) { container.innerHTML = '<p style="color:red;">Veriler çekilemedi.</p>'; return; }
  if (!topics || topics.length === 0) { container.innerHTML = '<p style="color:var(--gray);">Henüz konu açılmamış. İlk sen başlat!</p>'; return; }

  container.innerHTML = topics.map(t => `
    <div class="topic-card" onclick="openTopicDetail(${t.id}, '${t.title.replace(/'/g, "\\'")}', '${t.author_name}', '${t.category}')">
      <div>
        <h3 class="topic-title">${t.title}</h3>
        <p class="topic-meta">${t.author_name} • Kategori: ${t.category}</p>
      </div>
      <div style="color:var(--accent); font-weight:bold;">Tartışmaya Katıl →</div>
    </div>
  `).join('');
}

/* --- 2. EKRAN: KONU DETAYI VE YORUMLAR --- */
async function openTopicDetail(id, title, author, category) {
  currentActiveTopicId = id;
  
  // Arayüzü değiştir
  document.getElementById('topicListView').style.display = 'none';
  document.getElementById('topicDetailView').style.display = 'block';
  
  // Başlıkları doldur
  document.getElementById('detailTitle').innerText = title;
  document.getElementById('detailMeta').innerText = `Açan: ${author} • Kategori: ${category}`;
  
  // Yorumları Yükle
  loadReplies(id);
}

function closeTopicDetail() {
  currentActiveTopicId = null;
  document.getElementById('topicDetailView').style.display = 'none';
  document.getElementById('topicListView').style.display = 'block';
  // Geri döndüğünde listeyi tazele
  loadTopicsList();
}

async function loadReplies(topicId) {
  const container = document.getElementById('repliesContainer');
  container.innerHTML = '<p style="color:var(--gray);">Yorumlar yükleniyor...</p>';

  const { data: replies, error } = await supabase.from('replies').select('*').eq('topic_id', topicId).order('created_at', { ascending: true });

  if (error) { container.innerHTML = '<p style="color:red;">Yorumlar yüklenemedi.</p>'; return; }
  
  if (!replies || replies.length === 0) {
    container.innerHTML = '<p style="color:var(--gray); padding:20px 0; border-bottom:1px solid var(--border);">Henüz yorum yapılmamış. İlk cevabı sen yaz!</p>';
    return;
  }

  container.innerHTML = replies.map(r => `
    <div class="reply-card">
      <div class="reply-author">${r.author_name}</div>
      <div class="reply-content">${r.content}</div>
    </div>
  `).join('');
}

async function submitReply() {
  if (!currentUser) return;
  const contentInput = document.getElementById('replyContent');
  const content = contentInput.value.trim();
  
  if (!content) { alert("Lütfen bir cevap yazın."); return; }

  const { error } = await supabase.from('replies').insert([{
    topic_id: currentActiveTopicId,
    author_name: currentUser.user_metadata.full_name || currentUser.email,
    content: content
  }]);

  if (error) { alert("Hata: " + error.message); } 
  else {
    contentInput.value = ''; // Kutuyu temizle
    loadReplies(currentActiveTopicId); // Yorumları anında yenile
  }
}

/* --- YENİ KONU MODALI İŞLEMLERİ --- */
function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

async function createNewTopic() {
  if (!currentUser) { alert("Giriş yapmalısınız!"); return; }
  
  const title = document.getElementById('topicTitle').value.trim();
  const category = document.getElementById('topicCategory').value;
  
  if (!title) { alert("Lütfen konu başlığı girin."); return; }

  const { error } = await supabase.from('topics').insert([{
    title: title,
    category: category,
    author_name: currentUser.user_metadata.full_name || currentUser.email
  }]);

  if (error) { alert("Hata: " + error.message); } 
  else {
    document.getElementById('topicTitle').value = ''; // İçini temizle
    closeModal('newTopicModal'); // Pencereyi kapat
    loadTopicsList(); // Listeyi yenile
  }
}
</script>
</body>
</html>
